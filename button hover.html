<style>
 /*hover ♥☻*/ 

   .button {
    width: 100vw;
    height: 90cqh;
    

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 70px;
    
}
.button button {
    width: 150px;
    color: white;
    background: linear-gradient(50deg, aqua, rgb(40, 2, 145));
    border: none;
    font-size: 25px;
    height: 70px;
    border-radius: 40px;
    cursor: pointer;
}
.button1:hover{
    transform: scale(1.5,1);
}
.button2:hover{
    transform: translateX(10px);
    /*u can do : translateY */
}
.button3:hover{
    transform: skewX(15deg);
    /*u can do : skewY */

}
.button4:hover{
    transform: rotate(10deg);


}


body{
   background: linear-gradient(55deg, white, aqua, rgb(4, 6, 158));
}

</style>
<div class="button">
    <button class="button1">button 1</button>
    <button class="button2">button 2</button>
    <button class="button3">button 3</button>
    <button class="button4">button 4</button>
</div>
