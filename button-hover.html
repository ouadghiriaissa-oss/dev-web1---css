<!--button style-->
<style>
    .button { 
    color: white; 
    width: 200px; 
    height: 60px; 
    border-radius: 15px; 
    font-size: 30px; 
    font-weight: 700; 
    margin-top: 55px;    
    display: block; 
    margin: 0 auto; 
    border: none; 
    background: linear-gradient(
        80deg, 
        rgb(134, 218, 218), 
        rgb(49, 138, 165), 
        rgb(139, 219, 230),
        rgb(57, 123, 199), 
        rgb(18, 27, 148), 
        rgb(130, 20, 145)
    );
    background-size: 300% 100%;
    background-position: left;
     transition: background-position 1s ease;
    cursor: pointer;
}

.button:hover { 
    background-position: right;
}


body {

/*button center*/
  display: flex;
  justify-content: center;
  align-items: center;
  height: 88vh;
}



</style>
<button class="button">clique ici</button>
