<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login form exercie</title>
</head>
<body>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto&display=swap');
    
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:'poppins','sans-serif';


    }
        body{
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #dfdfdf;

        }
    .login-form{

        display: flex;
        justify-content: center;
        flex-direction: column;
        width: 440px;
        height: 480px;
        padding: 30px;
}
.login-header{
    text-align: center;
    margin: 20px 0 40px 0;

}
.login-header header{
    color: #333;
    font-size: 30px;
    font-weight: 900;
}
.input-box .input-field{
    width: 100%;
    height: 60px;
    font-size: 17px;
    padding: 0 25px;
    margin-bottom: 15px;
    border-radius: 30px;
    border: none;
    box-shadow: 0px 5px 10px 1px rgb(150, 148, 148);
    outline: none;
    transition: .3s;

}
::placeholder{
    font-weight: 500;
    color: #222;
}
.input-field:focus{
    width: 105%;
}
.forgot{
    display: flex;
    justify-content: space-between;
    margin-bottom: 40px;
}
section{
    display: flex;
    align-items: center;
    font-size: 14px;
    color: #555;
}
#chek{
    margin-right: 10px;
}
a{
    text-decoration: none;

}
a:hover{
    text-decoration: underline;

}
section a{
    color: #555;
}
.input-sumbit{
    position: relative;
}
.sumbit-btn {
    width: 100%;
    height: 60px;
    background: #222;
    color: white;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    transition: .3s;
    font-size: 25px;
    font-weight: 600;
    box-shadow: 0px 5px 10px rgb(122, 122, 122);
}
.sumbit-btn:hover{
    background: #000;
    transform: scale(1.05,1);
}
.sign-up-link{
    text-align: center;
    font-size: 15px;
    margin-top: 20px;
}
 .sign-up-link a{
    color: #000;
    font-weight: 600;
 }





    </style>
     <div class="login-form">

    <div class="login-header">
        <header>Login</header>
    </div>

    <div class="input-box">
        <input type="text" class="input-field" placeholder="Email" autocomplete="off" required>
    </div>

    <div class="input-box">
        <input type="password" class="input-field" placeholder="Password" autocomplete="off" required>
    </div>

    <div class="forgot">
        <section>
            <input type="checkbox" id="check">
            <label for="check">Remember me</label>
        </section>

        <section>
            <a href="#">Forgot password?</a>
        </section>
    </div>

    <div class="input-submit">
        <button class="sumbit-btn">sign in</button>
        
    </div>

    <div class="sign-up-link">
        <p>Don't have an account? <a href="#">Sign Up</a></p>
    </div>

</div>
</body>
</html>
